name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Lint, Typecheck, Test & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fusion_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy apps config

      - name: Check for Missing Migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest with Coverage Gate (>= 90%)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_NAME: fusion_saas_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: ci-test-secret-key-32-characters-minimum-length
        run: |
          cd backend
          pytest apps --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

